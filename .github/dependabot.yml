version: 2
updates:
  # GitHub Actions 工作流依赖 / workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"

  # Maven 依赖 / maven dependencies
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "maven"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
